{% extends 'window/base.html' %}

{% block content %}

<h1>
    О компании
</h1>

{% if company %}

    <h2>
        {{ company.title }}
    </h2>

    <p>
        {{ company.description }}
    </p>

    <p>
        {{ company.history }}
    </p>

    {% if company.logo %}

        <img
            src="{{ company.logo.url }}"
            width="300"
        >

    {% endif %}

{% endif %}

{% endblock %}
