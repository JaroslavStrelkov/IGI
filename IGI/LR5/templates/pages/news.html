{% extends 'window/base.html' %}

{% block content %}

<h1>
    Новости
</h1>

{% for item in news %}

    <h2>
        {{ item.title }}
    </h2>

    <p>
        {{ item.short_description }}
    </p>

    <p>
        {{ item.created_at }}
    </p>

    <p>
        {{ item.content }}
    </p>

    {% if item.image %}

        <img
            src="{{ item.image.url }}"
            width="300"
        >

    {% endif %}

    <hr>

{% endfor %}

{% endblock %}
